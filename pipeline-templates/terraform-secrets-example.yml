# Example Variable Group for Terraform Secrets
# This is an example of how to set up a variable group in Azure DevOps
# Do not commit actual secrets to version control!

variables:
  # AWS Credentials
  - name: AWS_ACCESS_KEY_ID
    value: '' # Leave empty and set as secret in Azure DevOps
    isSecret: true
  
  - name: AWS_SECRET_ACCESS_KEY
    value: '' # Leave empty and set as secret in Azure DevOps
    isSecret: true
  
  # Terraform State Backend
  - name: TerraformStateBucket
    value: 'your-terraform-state-bucket'
  
  - name: TerraformLockTable
    value: 'your-terraform-lock-table'
  
  # Notification Settings
  - name: SNS_EMAIL_LIST
    value: '["admin@example.com", "devops@example.com"]'
    isSecret: true
  
  - name: ApproverEmails
    value: 'admin@example.com;manager@example.com'
  
  # Slack Notification Settings
  - name: SlackChannel
    value: '#deployments'
  
  - name: SlackTeam
    value: 'YourTeamName'
  
  # Additional Secrets
  - name: DB_PASSWORD
    value: '' # Leave empty and set as secret in Azure DevOps
    isSecret: true
  
  - name: API_KEY
    value: '' # Leave empty and set as secret in Azure DevOps
    isSecret: true

# Instructions:
# 1. Create a variable group named 'terraform-secrets' in Azure DevOps
# 2. Import these variables
# 3. Set the actual values for secret variables in the Azure DevOps UI
# 4. Link this variable group to your pipeline